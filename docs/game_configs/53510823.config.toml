# macXenos built-in per-title config: Rise of the Tomb Raider (53510823).
# The title builds its 32x32x32 colour-grading LUT one slice per draw with a
# full-viewport quad whose vertex shader leaves clip-space Z at -9 W (the
# matrix in c40-c43 is the gameplay projection, the quad's Z is 0.5). The
# console rasterizes it; a host that clips against the near plane drops all
# 32 slices and the frame is graded through whatever the LUT memory held
# (green / magenta casts, 2026-10-17). Depth clamping keeps the quad and
# changes nothing else that was measured in this title.
#
# Whole-frame flashes in gameplay: two races in the Metal backend's lazy
# publication. 5d78b0a14 (the straddler re-assert keeps lazily published
# pages RAM-authoritative) removed the rings, white-outs and white veils, but
# single false-colour frames remain with lazy publication: about 20 per 480 s
# on an M4 Pro, about one a minute on an M5 Max (2026-11-15). Copying
# GPU-written memory back at swaps and fence packets instead
# (metal_eager_publish_title) removes every flash. It costs nothing on M4 and
# later Macs (30 fps held), but holds an M1 Max at about 15 fps in play.
[GPU]
force_depth_clamp = true
metal_eager_publish_title = true
