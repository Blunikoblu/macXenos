<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CF06A"/>
      <stop offset="0.55" stop-color="#1DB954"/>
      <stop offset="1" stop-color="#0A7A6B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3E8EE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#04382F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background (full bleed; the macOS squircle mask is applied on packaging) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- confetti stars -->
  <g fill="#FFF7B0" opacity="0.9">
    <path d="M810 170 l14 34 36 4 -28 23 9 35 -31 -19 -31 19 9 -35 -28 -23 36 -4z"/>
    <circle cx="190" cy="230" r="14"/>
    <circle cx="860" cy="420" r="10"/>
    <circle cx="150" cy="760" r="11"/>
  </g>

  <!-- speed lines: "Go!" -->
  <g stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" opacity="0.85">
    <line x1="90"  y1="470" x2="215" y2="470"/>
    <line x1="60"  y1="555" x2="200" y2="555"/>
    <line x1="105" y1="640" x2="215" y2="640"/>
  </g>

  <!-- the controller buddy, tilted as if dashing forward -->
  <g transform="rotate(-8 560 560)" filter="url(#shadow)">
    <!-- body -->
    <path d="M330 400
             C 400 360, 720 360, 790 400
             C 870 445, 925 640, 900 735
             C 880 810, 800 820, 755 760
             L 705 690
             C 640 715, 480 715, 415 690
             L 365 760
             C 320 820, 240 810, 220 735
             C 195 640, 250 445, 330 400 Z"
          fill="url(#pad)" stroke="#0B3B33" stroke-width="18" stroke-linejoin="round"/>

    <!-- d-pad (left) -->
    <g fill="#2C3440">
      <rect x="318" y="478" width="34" height="100" rx="8"/>
      <rect x="285" y="511" width="100" height="34" rx="8"/>
    </g>

    <!-- face buttons (right) -->
    <circle cx="790" cy="490" r="20" fill="#F5C518"/>
    <circle cx="750" cy="530" r="20" fill="#2E86FF"/>
    <circle cx="830" cy="530" r="20" fill="#FF4D4D"/>
    <circle cx="790" cy="570" r="20" fill="#1DB954" stroke="#0B3B33" stroke-width="4"/>

    <!-- eyes -->
    <g>
      <ellipse cx="500" cy="500" rx="42" ry="54" fill="#0B1F1C"/>
      <ellipse cx="620" cy="500" rx="42" ry="54" fill="#0B1F1C"/>
      <circle cx="514" cy="480" r="15" fill="#FFFFFF"/>
      <circle cx="634" cy="480" r="15" fill="#FFFFFF"/>
      <circle cx="490" cy="522" r="7"  fill="#FFFFFF" opacity="0.8"/>
      <circle cx="610" cy="522" r="7"  fill="#FFFFFF" opacity="0.8"/>
    </g>
    <!-- cheeks -->
    <ellipse cx="445" cy="585" rx="30" ry="17" fill="#FF8FA3" opacity="0.75"/>
    <ellipse cx="675" cy="585" rx="30" ry="17" fill="#FF8FA3" opacity="0.75"/>
    <!-- big grin -->
    <path d="M510 580 Q 560 640 610 580" fill="none" stroke="#0B1F1C" stroke-width="16" stroke-linecap="round"/>
    <!-- tongue -->
    <path d="M540 598 Q 560 628 582 598" fill="#FF6B81"/>
  </g>
</svg>
